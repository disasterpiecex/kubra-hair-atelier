name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, v1.1 ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare direct v1.1 source
        run: |
          rm -rf source
          mkdir source
          unzip -q kubra-hair-atelier-v1.0-android-build-ready.zip -d source
          cp -a source/kubra-hair-atelier-v1/assets ./assets
          test -f App.tsx
          test -f api.ts
          test -f app.json
          test -f package.json
          test -f tsconfig.json
          node -p "'Building direct source version ' + require('./package.json').version"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Force JS bundle into debug APK
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          marker = 'react {\n'
          if marker not in s:
              raise SystemExit('react { block not found in android/app/build.gradle')
          if 'debuggableVariants = []' not in s:
              s = s.replace(marker, marker + '    debuggableVariants = []\n', 1)
          p.write_text(s)
          print('Configured debug variant to bundle JavaScript into the APK.')
          PY

      - name: Build standalone debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify bundled JavaScript exists
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'index.android.bundle|assets/.*bundle' || {
            echo 'JavaScript bundle missing from APK'
            exit 1
          }

      - name: Collect APK
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Kubra-Hair-Atelier-v${VERSION}-standalone.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Kubra-Hair-Atelier-Android-APK-Standalone
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
