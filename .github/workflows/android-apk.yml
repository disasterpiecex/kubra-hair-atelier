name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, v1.1, v1.2, v1.3 ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare direct app source
        run: |
          rm -rf source
          mkdir source
          unzip -q kubra-hair-atelier-v1.0-android-build-ready.zip -d source
          cp -a source/kubra-hair-atelier-v1/assets ./assets
          test -f App.tsx
          test -f api.ts
          test -f app.json
          test -f package.json
          test -f tsconfig.json
          rm -f v1.1-src/App.tsx
          sed -i 's/StyleSheet\.absoluteFillObject/StyleSheet.absoluteFill/g' App.tsx
          if [ -f v1.2-src/patch_v12.py ]; then
            python v1.2-src/patch_v12.py App.tsx
          fi
          if [ -f v1.3-src/patch_v13.py ]; then
            python v1.3-src/patch_v13.py App.tsx
          fi
          sed -i "s#opening-hair.jpg#opening-hair.png#g" App.tsx
          node -p "'Building direct source version ' + require('./package.json').version"

      - name: Render v1.3 brand artwork
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 v1.3-src/icon-simplified.svg -o assets/icon.png
          cp assets/icon.png assets/adaptive-icon.png
          rsvg-convert -w 1080 -h 1600 v1.3-src/opening-hair.svg -o assets/opening-hair.png
          file assets/icon.png assets/opening-hair.png

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Force JS bundle into debug APK
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          marker = 'react {\n'
          if marker not in s:
              raise SystemExit('react { block not found in android/app/build.gradle')
          if 'debuggableVariants = []' not in s:
              s = s.replace(marker, marker + '    debuggableVariants = []\n', 1)
          p.write_text(s)
          print('Configured debug variant to bundle JavaScript into the APK.')
          PY

      - name: Build standalone debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify bundled JavaScript exists
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'index.android.bundle|assets/.*bundle' || {
            echo 'JavaScript bundle missing from APK'
            exit 1
          }

      - name: Collect APK
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Kubra-Hair-Atelier-v${VERSION}-standalone.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Kubra-Hair-Atelier-Android-APK-Standalone
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
