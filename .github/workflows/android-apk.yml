name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare uploaded project
        run: |
          if [ -f kubra-hair-atelier-v1.0-android-build-ready.zip ]; then
            mkdir source
            unzip -q kubra-hair-atelier-v1.0-android-build-ready.zip -d source
            cp -a source/kubra-hair-atelier-v1/. .
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Kubra-Hair-Atelier-v1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kubra-Hair-Atelier-Android-APK
          path: dist/Kubra-Hair-Atelier-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
