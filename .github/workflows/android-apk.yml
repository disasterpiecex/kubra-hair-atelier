name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, v1.1, v1.2, v1.3, v1.4, v1.5, v1.6, v1.7, v1.7.1 ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare direct app source
        run: |
          rm -rf source
          mkdir source
          unzip -q kubra-hair-atelier-v1.0-android-build-ready.zip -d source
          cp -a source/kubra-hair-atelier-v1/assets ./assets
          test -f App.tsx
          test -f api.ts
          test -f app.json
          test -f package.json
          test -f tsconfig.json
          rm -f v1.1-src/App.tsx
          sed -i 's/StyleSheet\.absoluteFillObject/StyleSheet.absoluteFill/g' App.tsx
          if [ -f v1.2-src/patch_v12.py ]; then python v1.2-src/patch_v12.py App.tsx; fi
          if [ -f v1.3-src/patch_v13.py ]; then python v1.3-src/patch_v13.py App.tsx; fi
          if [ -f v1.4-src/patch_v14.py ]; then python v1.4-src/patch_v14.py App.tsx; fi
          sed -i "s/opening-approved\.jpg/opening-approved.png/g" App.tsx
          if [ -f v1.5-src/patch_v15.py ]; then python v1.5-src/patch_v15.py App.tsx; fi
          sed -i 's/ remove={removePhoto}//g' App.tsx
          if [ -f v1.6-src/patch_v16.py ]; then python v1.6-src/patch_v16.py App.tsx; fi
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('App.tsx')
          s=p.read_text()
          s=re.sub(r'(<PhotoScreen\s+photoUri=\{photoUri\}\s+pick=\{pick\}\s+take=\{take\})(?!\s+remove=)', r'\1 remove={removePhoto}', s)
          p.write_text(s)
          PY
          if [ -f v1.7-src/patch_v17.py ]; then python v1.7-src/patch_v17.py App.tsx; fi
          if [ -f v1.7.1-src/patch_v171.py ]; then python v1.7.1-src/patch_v171.py App.tsx; fi
          node -p "'Building direct source version ' + require('./package.json').version"

      - name: Render brand assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick curl
          rsvg-convert -w 1024 -h 1024 v1.7-src/icon-purple-4.svg -o assets/icon.png
          cp assets/icon.png assets/adaptive-icon.png
          rsvg-convert -w 720 -h 1280 v1.7-src/splash-candidate-5.svg -o assets/v17-opening.png
          cp v1.4-src/approved-opening.png assets/opening-approved.png
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1767051239621-c59dbc6d08ec?auto=format&fit=crop&fm=jpg&q=85&w=1400' -o assets/v15-opening.jpg
          identify assets/icon.png assets/adaptive-icon.png assets/v15-opening.jpg assets/v17-opening.png

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Remove legacy Android splash artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          transparent = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=')
          logos=list(Path('android/app/src/main/res').rglob('splashscreen_logo.png'))
          if not logos:
              raise SystemExit('No splashscreen_logo.png resources found')
          for p in logos:
              p.write_bytes(transparent)
              print('Neutralized',p)
          PY

      - name: Force JS bundle into debug APK
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          marker = 'react {\n'
          if marker not in s: raise SystemExit('react { block not found in android/app/build.gradle')
          if 'debuggableVariants = []' not in s:
              s = s.replace(marker, marker + '    debuggableVariants = []\n', 1)
          p.write_text(s)
          PY

      - name: Build standalone debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify legacy grid is absent from APK
        run: |
          rm -rf splash-check && mkdir splash-check
          cd splash-check
          unzip -q ../android/app/build/outputs/apk/debug/app-debug.apk 'res/*/splashscreen_logo.png' || true
          python - <<'PY'
          from pathlib import Path
          logos=list(Path('.').rglob('splashscreen_logo.png'))
          if not logos: raise SystemExit('Packaged splash logo not found')
          bad=[(str(p),p.stat().st_size) for p in logos if p.stat().st_size>200]
          print('Packaged splash resources:',[(str(p),p.stat().st_size) for p in logos])
          if bad: raise SystemExit(f'Legacy splash artwork still packaged: {bad}')
          PY

      - name: Verify bundled JavaScript exists
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'index.android.bundle|assets/.*bundle' || { echo 'JavaScript bundle missing from APK'; exit 1; }

      - name: Collect APK
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Kubra-Hair-Atelier-v${VERSION}-standalone.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Kubra-Hair-Atelier-Android-APK-Standalone
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
