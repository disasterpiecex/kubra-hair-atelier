services:
  - type: web
    name: kubra-hair-atelier-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: KHA_VISION_MODEL
        value: gpt-5.6-luna
      - key: KHA_IMAGE_MODEL
        value: gpt-image-2
